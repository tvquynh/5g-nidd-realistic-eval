# Model hyperparameters for the 5G-NIDD evaluation-protocol study
# n_jobs scaled by server (60 cores)

lightgbm:
  objective: multiclass
  metric: multi_logloss
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_data_in_leaf: 20
  feature_fraction: 0.9
  bagging_fraction: 0.9
  bagging_freq: 5
  num_iterations: 300
  early_stopping_rounds: 25
  verbose: -1
  n_jobs: 16

xgboost:
  objective: multi:softprob
  eval_metric: mlogloss
  learning_rate: 0.05
  max_depth: 8
  min_child_weight: 5
  subsample: 0.9
  colsample_bytree: 0.9
  n_estimators: 300
  early_stopping_rounds: 25
  tree_method: hist
  nthread: 16

random_forest:
  n_estimators: 300
  max_depth: 25
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt
  class_weight: balanced
  n_jobs: 16

logistic_regression:
  penalty: l2
  C: 1.0
  max_iter: 1000
  solver: lbfgs
  class_weight: balanced
  n_jobs: 16

mlp:
  hidden_layer_sizes: [128, 64]
  activation: relu
  solver: adam
  alpha: 0.0001
  batch_size: 512
  learning_rate_init: 0.001
  max_iter: 100
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 10
